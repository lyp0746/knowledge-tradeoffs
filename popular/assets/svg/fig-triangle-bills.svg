<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="900" height="680" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">不可能三角：三张账单</text>
<text x="450" y="62" text-anchor="middle" font-size="14" fill="#666666">完备 C / 可组合 A / 传递 T —— 至多同时满足两个</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs>
<polygon points="450,140 320,365 580,365" fill="#f7f9fc" stroke="#9aa4b2" stroke-width="2"/>
<circle cx="450" cy="140" r="10" fill="#2f6db0"/>
<circle cx="320" cy="365" r="10" fill="#2e7d32"/>
<circle cx="580" cy="365" r="10" fill="#ef6c00"/>
<text x="450.0" y="106.0" text-anchor="middle" font-size="18" fill="#2f6db0" font-weight="bold">完备 C（看得准）</text>
<text x="320.0961894323342" y="407.0" text-anchor="middle" font-size="17" fill="#2e7d32" font-weight="bold">可组合 A（拼得上）</text>
<text x="579.9038105676658" y="407.0" text-anchor="middle" font-size="17" fill="#ef6c00" font-weight="bold">传递 T（传得下去）</text>
<text x="450" y="300" text-anchor="middle" font-size="26" fill="#b8862f" font-weight="bold">至多取二</text>
<rect x="26.0" y="500" width="268" height="86" rx="8" fill="#fbfcfe" stroke="#2f6db0" stroke-width="1.4"/>
<text x="160.0" y="534" text-anchor="middle" font-size="16" fill="#2f6db0" font-weight="bold">要 C + A → 让出 T</text>
<text x="160.0" y="562" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">账单：离散→连续 的 1/3 缺口</text>
<rect x="316.0" y="500" width="268" height="86" rx="8" fill="#fbfcfe" stroke="#2e7d32" stroke-width="1.4"/>
<text x="450.0" y="534" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">要 C + T → 让出 A</text>
<text x="450.0" y="562" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">账单：子模性，能力不能相加</text>
<rect x="606.0" y="500" width="268" height="86" rx="8" fill="#fbfcfe" stroke="#ef6c00" stroke-width="1.4"/>
<text x="740.0" y="534" text-anchor="middle" font-size="16" fill="#ef6c00" font-weight="bold">要 A + T → 让出 C</text>
<text x="740.0" y="562" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">账单：τ 发散，预测失效</text>
</svg>