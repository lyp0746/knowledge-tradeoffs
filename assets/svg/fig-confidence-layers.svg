<text x="124" y="148" text-anchor="start" font-size="18" fill="#1a1a1a" font-weight="bold">因果</text>
<text x="242.0" y="148" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">这导致了……</text>
<rect x="90" y="186" width="211.0" height="62" rx="6" fill="#ef6c00" stroke="#ef6c00" stroke-width="1.4"/>
<rect x="90" y="186" width="211" height="62" rx="6" fill="#ef6c00" opacity="0.16"/>
<text x="124" y="224" text-anchor="start" font-size="18" fill="#1a1a1a" font-weight="bold">诠释</text>
<text x="281.0" y="224" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">这标志一个时代……</text>
<rect x="90" y="262" width="281.2" height="62" rx="6" fill="#b8862f" stroke="#b8862f" stroke-width="1.4"/>
<rect x="90" y="262" width="281" height="62" rx="6" fill="#b8862f" opacity="0.16"/>
<text x="124" y="300" text-anchor="start" font-size="18" fill="#1a1a1a" font-weight="bold">推理</text>
<text x="351.2" y="300" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">他因此被排挤……</text>
<rect x="90" y="338" width="348.8" height="62" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.4"/>
