<text x="440" y="62" text-anchor="middle" font-size="14" fill="#666666">同一批材料，越往上层，置信度越低，分歧越难消除</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs>
<rect x="90" y="110" width="172.0" height="62" rx="6" fill="#c62828" stroke="#c62828" stroke-width="1.4"/>
