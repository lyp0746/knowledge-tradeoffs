<text x="124" y="376" text-anchor="start" font-size="18" fill="#1a1a1a" font-weight="bold">事实</text>
<text x="418.8" y="376" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">他确实说过这句话</text>
<text x="290" y="88" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">越往上：越容易各取所需</text>
<text x="600" y="148" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold">置信度 20%</text>
<text x="600" y="224" text-anchor="start" font-size="13" fill="#ef6c00" font-weight="bold">置信度 35%</text>
<text x="600" y="300" text-anchor="start" font-size="13" fill="#b8862f" font-weight="bold">置信度 62%</text>
<text x="600" y="376" text-anchor="start" font-size="13" fill="#2e7d32" font-weight="bold">置信度 88%</text>
<rect x="600" y="430" width="240" height="66" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.4"/>
<text x="720" y="458" text-anchor="middle" font-size="14" fill="#ef6c00" font-weight="bold">材料增加</text>
<text x="720" y="480" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">主要提高下层；上层分歧照旧</text>
