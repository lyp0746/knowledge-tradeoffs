<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="880" height="520" fill="#ffffff"/>
