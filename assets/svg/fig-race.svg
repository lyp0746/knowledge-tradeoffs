<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">同一件事，三个场景，三种 τ</text>
<text x="450" y="62" text-anchor="middle" font-size="14" fill="#666666">橙＝你有的时间；蓝＝最短处理时间。蓝比橙长多少，就有多来不及</text>
<text x="188" y="136" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="bold">急诊：胸痛</text>
<rect x="210" y="112" width="21" height="16" rx="4" fill="#ef6c00" opacity="0.85"/>
<text x="241.42857142857142" y="125" text-anchor="start" font-size="12" fill="#ef6c00" font-weight="normal">1</text>
<rect x="210" y="134" width="43" height="16" rx="4" fill="#2f6db0" opacity="0.85"/>
<text x="262.8571428571429" y="147" text-anchor="start" font-size="12" fill="#2f6db0" font-weight="normal">2</text>
<text x="582" y="125" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold">τ ≈ 2　来不及</text>
<text x="188" y="241" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="bold">公司：产品召回</text>
<rect x="210" y="217" width="21" height="16" rx="4" fill="#ef6c00" opacity="0.85"/>
<text x="241.42857142857142" y="230" text-anchor="start" font-size="12" fill="#ef6c00" font-weight="normal">1</text>
<rect x="210" y="239" width="300" height="16" rx="4" fill="#2f6db0" opacity="0.85"/>
<text x="520.0" y="252" text-anchor="start" font-size="12" fill="#2f6db0" font-weight="normal">14</text>
<text x="582" y="230" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold">τ ≈ 14　严重来不及</text>
<text x="188" y="346" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="bold">气候：临界点</text>
<rect x="210" y="322" width="300" height="16" rx="4" fill="#ef6c00" opacity="0.85"/>
<text x="520" y="335" text-anchor="start" font-size="12" fill="#ef6c00" font-weight="normal">40</text>
<rect x="210" y="344" width="300" height="16" rx="4" fill="#2f6db0" opacity="0.85"/>
<text x="520" y="357" text-anchor="start" font-size="12" fill="#2f6db0" font-weight="normal"></text>
<text x="520" y="357" text-anchor="start" font-size="12" fill="#2f6db0" font-weight="normal">40+</text>
<text x="582" y="335" text-anchor="start" font-size="13" fill="#b8862f" font-weight="bold">τ ≈ 1　且每年变大</text>
<text x="450.0" y="432" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">τ 不是“态度指标”，是算术：先量红条，再量蓝条。</text>
</svg>