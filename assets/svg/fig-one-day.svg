<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="380" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">一天里的六个核心：从七点到晚上十点</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">同一套尺子，在一个普通家庭的一天里各出现一次</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs>
<line x1="70" y1="200" x2="930" y2="200" stroke="#999" stroke-width="2"/>
<circle cx="96" cy="200" r="8" fill="#2f6db0"/>
<line x1="96" y1="192" x2="96" y2="140" stroke="#2f6db0" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="95.8" y="128" text-anchor="middle" font-size="15" fill="#2f6db0" font-weight="bold">07:00　看见</text>
<text x="95.8" y="150" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">妈妈看体检报告</text>
<circle cx="233" cy="200" r="8" fill="#2e7d32"/>
<line x1="233" y1="208" x2="233" y2="260" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="233.4" y="282" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">08:00　记住</text>
<text x="233.4" y="304" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">小满的书包</text>
<circle cx="397" cy="200" r="8" fill="#ef6c00"/>
<line x1="397" y1="192" x2="397" y2="140" stroke="#ef6c00" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="396.8" y="128" text-anchor="middle" font-size="15" fill="#ef6c00" font-weight="bold">16:00　跟上</text>
<text x="396.8" y="150" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">爸爸的会议</text>
<circle cx="552" cy="200" r="8" fill="#b8862f"/>
<line x1="552" y1="208" x2="552" y2="260" stroke="#b8862f" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="551.6" y="282" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">19:00　选择</text>
<text x="551.6" y="304" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">白板上的三角形</text>
<circle cx="706" cy="200" r="8" fill="#8e5a9c"/>
<line x1="706" y1="192" x2="706" y2="140" stroke="#8e5a9c" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="706.4" y="128" text-anchor="middle" font-size="15" fill="#8e5a9c" font-weight="bold">21:00　讲述</text>
<text x="706.4" y="150" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">爷爷和姑姑吵架</text>
<circle cx="870" cy="200" r="8" fill="#c62828"/>
<line x1="870" y1="208" x2="870" y2="260" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="869.8000000000001" y="282" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">22:00　临界</text>
<text x="869.8000000000001" y="304" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">小满画“会飞的鱼”</text>
<text x="500.0" y="350" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">一天过完，等于把一整套取舍做过一遍——只是我们平时没给它起名字。</text>
</svg>