<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="940" height="470" fill="#ffffff"/>
<text x="470" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">同一群人，三种划线，三种代价</text>
<text x="470" y="62" text-anchor="middle" font-size="14" fill="#666666">线没有“对不对”，只有“为哪一个问题服务”</text>
<rect x="30" y="88" width="280" height="340" rx="8" fill="#fbfcfe" stroke="#2f6db0" stroke-width="1.4"/>
<rect x="30" y="88" width="280" height="42" rx="8" fill="#2f6db0" opacity="0.16"/>
<text x="170.0" y="116" text-anchor="middle" font-size="16" fill="#2f6db0" font-weight="bold">分法一：按左边 / 右边</text>
<circle cx="113" cy="222" r="7" fill="#2f6db0" opacity="0.85"/>
<circle cx="163" cy="204" r="7" fill="#2f6db0" opacity="0.85"/>
<circle cx="227" cy="218" r="7" fill="#2f6db0" opacity="0.85"/>
<circle cx="119" cy="272" r="7" fill="#2f6db0" opacity="0.85"/>
<circle cx="179" cy="278" r="7" fill="#2f6db0" opacity="0.85"/>
<circle cx="233" cy="264" r="7" fill="#2f6db0" opacity="0.85"/>
<line x1="193" y1="180" x2="193" y2="300" stroke="#c62828" stroke-width="2.4"/>
<text x="170.0" y="340" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="normal">得到：两类很整齐</text>
<text x="170.0" y="372" text-anchor="middle" font-size="13" fill="#c62828" font-weight="normal">丢掉：跨过线的那两个朋友</text>
<text x="170.0" y="404" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">同一个班，同六个人</text>
<rect x="335" y="88" width="280" height="340" rx="8" fill="#fbfcfe" stroke="#2e7d32" stroke-width="1.4"/>
<rect x="335" y="88" width="280" height="42" rx="8" fill="#2e7d32" opacity="0.16"/>
<text x="475.0" y="116" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">分法二：按亲疏远近</text>
<circle cx="418" cy="222" r="7" fill="#2e7d32" opacity="0.85"/>
<circle cx="468" cy="204" r="7" fill="#2e7d32" opacity="0.85"/>
<circle cx="532" cy="218" r="7" fill="#2e7d32" opacity="0.85"/>
<circle cx="424" cy="272" r="7" fill="#2e7d32" opacity="0.85"/>
<circle cx="484" cy="278" r="7" fill="#2e7d32" opacity="0.85"/>
<circle cx="538" cy="264" r="7" fill="#2e7d32" opacity="0.85"/>
<line x1="400" y1="190" x2="560" y2="300" stroke="#c62828" stroke-width="2.4"/>
<text x="475.0" y="340" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="normal">得到：小圈子很清楚</text>
<text x="475.0" y="372" text-anchor="middle" font-size="13" fill="#c62828" font-weight="normal">丢掉：成绩与座位的关系</text>
<text x="475.0" y="404" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">同一个班，同六个人</text>
<rect x="640" y="88" width="280" height="340" rx="8" fill="#fbfcfe" stroke="#ef6c00" stroke-width="1.4"/>
<rect x="640" y="88" width="280" height="42" rx="8" fill="#ef6c00" opacity="0.16"/>
<text x="780.0" y="116" text-anchor="middle" font-size="16" fill="#ef6c00" font-weight="bold">分法三：按上面 / 下面</text>
<circle cx="723" cy="222" r="7" fill="#ef6c00" opacity="0.85"/>
<circle cx="773" cy="204" r="7" fill="#ef6c00" opacity="0.85"/>
<circle cx="837" cy="218" r="7" fill="#ef6c00" opacity="0.85"/>
<circle cx="729" cy="272" r="7" fill="#ef6c00" opacity="0.85"/>
<circle cx="789" cy="278" r="7" fill="#ef6c00" opacity="0.85"/>
<circle cx="843" cy="264" r="7" fill="#ef6c00" opacity="0.85"/>
<line x1="705" y1="246" x2="865" y2="246" stroke="#c62828" stroke-width="2.4"/>
<text x="780.0" y="340" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="normal">得到：前后排一目了然</text>
<text x="780.0" y="372" text-anchor="middle" font-size="13" fill="#c62828" font-weight="normal">丢掉：谁跟谁在说话</text>
<text x="780.0" y="404" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">同一个班，同六个人</text>
<text x="470.0" y="456" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">换一个目的，就该换一条线；换不动线的人，只能换目的。</text>
</svg>